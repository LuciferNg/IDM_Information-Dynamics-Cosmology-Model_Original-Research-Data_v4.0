[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "cfas"
version = "0.1.0"
description = "Consistency Field Applied Science — finite budget physics, cosmology, and consciousness"
authors = [{name = "Lucifer Ng"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.scripts]
cfas = "cfas.cli:main"
[project.urls]
Source = "https://github.com/LuciferNg/IDM4.0-Consistency-Field-Applied-Science"
Documentation = "https://cfas.readthedocs.io"

[tool.setuptools.packages.find]
include = ["cfas*"]